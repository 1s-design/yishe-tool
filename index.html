<!DOCTYPE html>
<html class="notranslate" translate="no">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport"
        content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no, viewport-fit=cover">

    <meta name="google" content="notranslate" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="A browser-based design tool for 2D and 3D editing, template customization, and content publishing.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link data-react-helmet="true" rel="icon" type="image/png" href="/favicon.png" sizes="16x16">
</head>

<body>
    <div id="app">
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                background: #0f1115;
                color: #f5f7fa;
            }

            .app-loading-shell {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                min-height: 100%;
                padding: 24px;
                background: #0f1115;
                color: #f5f7fa;
                box-sizing: border-box;
            }

            .app-loading-shell__stage {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: min(100%, 320px);
                text-align: center;
            }

            .app-loading-shell__text {
                display: flex;
                align-items: center;
                min-height: 1.5rem;
            }

            .app-loading-shell__text p {
                --app-loading-duration: 3s;
                --app-loading-text: #f5f7fa;

                position: relative;
                margin: 0;
                color: var(--app-loading-text);
                font-family: Arial, Helvetica, sans-serif;
                font-size: clamp(0.85rem, 1.3vw, 1.1rem);
                font-weight: 800;
                font-style: italic;
                letter-spacing: 0.04em;
                line-height: 1.2;
                -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
                mask-image: linear-gradient(90deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
                -webkit-mask-size: 250% 100%;
                mask-size: 250% 100%;
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
                animation: app-loading-mask var(--app-loading-duration) linear infinite;
            }

            @keyframes app-loading-mask {
                0% {
                    -webkit-mask-position: 150% 0;
                    mask-position: 150% 0;
                }

                100% {
                    -webkit-mask-position: -150% 0;
                    mask-position: -150% 0;
                }
            }

            @media (max-width: 640px) {
                .app-loading-shell {
                    padding: 20px;
                }

                .app-loading-shell__stage {
                    width: min(100%, 280px);
                    gap: 6px;
                }

                .app-loading-shell__text {
                    min-height: 1.4rem;
                }

                .app-loading-shell__text p {
                    font-size: 0.95rem;
                }
            }
        </style>

        <div class="app-loading-shell" role="status" aria-live="polite" aria-label="%VITE_APP_SHORT_NAME% loading">
            <div class="app-loading-shell__stage">
                <div class="app-loading-shell__text">
                    <p>%VITE_APP_SHORT_NAME%...</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/modules/main/main.ts"></script>
</body>

</html>
